<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101d32"><title>ZTREND | Developer Portal</title><link rel="stylesheet" href="../css/style.css?v=20261031"></head><body data-portal="developer"><div id="app"><section class="login" id="login"><div class="login-orbit orbit-one"></div><div class="login-orbit orbit-two"></div><div class="login-brand"><img class="login-brand-logo" src="../assets/ztrend-mark.png" alt="ZTREND logo"></div><div class="loginbox"><div class="login-kicker"><i></i><span id="portalLabel">DEVELOPER ACCESS</span></div><h1 id="loginTitle">Developer Portal</h1><p id="loginSub">Platform administration · Admin accounts</p><div id="signinbox"><form id="signinForm" onsubmit="return false"><label for="email">Work email</label><input id="email" type="email" autocomplete="username" placeholder="Enter your registered email" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" placeholder="Enter your password" required><button type="submit" class="btn primary wide" id="signin">Sign in <span>→</span></button></form><div id="err" class="error" role="alert"></div><div class="login-footnote"><span class="secure-dot"></span> Authorized developer access only</div></div></div></section><div id="appview" class="hidden"></div></div><div id="modal"></div><div id="toast" role="status"></div><script>
(()=>{try{const k='ztrend_workforce_v3';const raw=localStorage.getItem(k);if(!raw)return;const d=JSON.parse(raw);if(!d||typeof d!=='object'||Array.isArray(d))return;for(const key of ['users','companies','projects','shifts','attendance','leaves'])if(!Array.isArray(d[key]))d[key]=[];d.users=d.users.filter(u=>u&&typeof u==='object'&&typeof u.email==='string').map(u=>({...u,email:u.email.trim(),password:String(u.password??''),role:String(u.role??''),status:String(u.status??'Active')}));localStorage.setItem(k,JSON.stringify(d));}catch(e){console.warn('Developer portal data check skipped:',e);}})();
</script>
<script src="../js/app.js?v=20261031-loginfix"></script></body></html>
